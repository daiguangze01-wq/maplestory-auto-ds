bot:
  mode: "hunt" # detect = 只检测不攻击, hunt
  pickup_interval: 0           # 0 表示关闭脚本自动拾取
  chase_visible: true           # 幽灵地图全屏找怪，沿当前平台接近可攻击目标
  jump_attack: true
  jump_attack_interval: 0.65   # 两次起跳之间的最短秒数
  attack: "directional"
  map: "north_forest_2"
  enable_route: false

system:
  fps_limit_main: 15

game_window:
  working_width: 1280         # 客户区等比缩放至此宽度，供识别和预览使用

platform_profile: "maps/subway_line1_area4/platforms.yaml"

key:
  jump: "c"
  directional_attack: "s"
  aoe_skill: "s"
  add_hp: "end"
  add_mp: "home"

title:
  template: "character/medal_green.png"
  confirm_unique_color: true    # 画面边缘也可按勋章的形状和颜色确认唯一候选
  partial_green_medal: true    # 遮挡时用可见半边的颜色和字形定位
  enable: true
  mode: "grayscale"           # 当前这张 title.png 建议先用 grayscale；如果现场干扰多再切 white_mask
  manual_select: true          # 在监视器窗口里点击称号候选框，手动锁定自己的角色
  max_candidates: 8
  candidate_threshold: 0.055
  lock_miss_tolerance: 18
  manual_track_radius: 180
  manual_track_threshold: 0.055
  offset: [0, -60]
  match_threshold: 0.045
  cache_ttl: 30                # 更频繁重搜，降低锁到错误 UI 文本的概率
  prev_search_radius: 180      # 优先在上次位置附近找，减少吸到其他玩家
  center_search_radius: 320    # 只在屏幕中部较大范围内做中心候选搜索
  center_accept_radius: 220    # 超出中心太远的候选直接拒绝
  max_jump_px: 140             # 新候选离上次位置太远时拒绝切换
  stick_to_prev_margin: 0.03   # 新候选没有明显更优时，继续沿用上次锁定
  strong_match_threshold: 0.025
  white_lower: 185             # white_mask 模式备用参数
  white_upper: 255
  blur_kernel: 1
#  这个是魔法密林 北部2的 位置 先存下
#  x: 10
#  y: 149
#  width: 189
#  height: 144
############################
minimap:
  x: 6
  y: 67
  width: 230
  height: 74
  player_color: [65, 250, 250]   # 客户区缩放到 1280 宽后的小黄点 BGR
  player_tolerance: 20

monster_detect:
  # monsters: ["Octopus","lan_mo_gu"]
  monsters: ["ghost"]
  # monsters: ["black_axe_stump"]
  # monsters: ["OrangeMushroom2"]
  mode: "color"                     # color / grayscale / contour_only
  diff_thres: 0.10                  # 幽灵模板匹配阈值（越小越严格）
  scales: [1.0]                     # GMS v83 大幽灵素材已按 1280 宽检测画面缩放至原图的 93.75%
  display_scale: 0.47               # 监视器缩放 0.1~1.0（越小越流畅）
  detection_interval: 1             # 每帧更新可攻击目标，目标消失即停手
  with_enemy_hp_bar: false          # 仅按幽灵外观计数
  hp_bar_color: [0, 255, 0]         # 怪物血条 BGR 颜色（绿色）
  hp_bar_tolerance: 30              # 颜色容差（实际是0,243,0，容差30能匹配到）

directional_attack:
  range_x: 200                     # 左右各 200，攻击框总宽 400（1280 宽检测画面）
  range_y: 100                     # 上下各 100，攻击框总高 200
  attack_in_place: true            # 原地攻击：不移动持续攻击（刷固定点用）
  aoe_monster_count: 3             # 识别怪物>=此数量时使用群攻
  in_place_walk_interval: 300      # 原地攻击时每隔多少帧左右走动一次（防攻击失效）
  in_place_walk_frames: 4         # 单方向走多少帧（走动幅度）
  in_place_stop_attack_frames: 8  # 移动前先停攻击多少帧（约0.5s@15fps）
  in_place_walk_dir: "alternate"   # alternate=左右交替 / left / right
  search_flip_frames: 4800            # 每方向走480帧（约16秒@30fps）
  search_max_offset_px: 10000          # 单边最远走600px（翻倍）
  search_stall_frames: 0             # 0=关闭stall检测（无路线时小地图动太慢会误判卡住）
  search_stall_min_delta_px: 0       # 同上，关掉。范围全靠 search_flip_frames 控制
  search_random_jump_chance: 0.03   # 找怪时随机跳跃概率（每帧），0=关闭
  search_random_jump_cd: 45         # 跳跃冷却帧数，避免连跳

route:
  climb_y_offset: 0.5                 # 爬梯Y偏移量（像素），改小=梯子更短
  climb_y_interval: 5             # 每N帧偏移一次，改大=梯子更短

health_monitor:
  enable: false                    # 补血和补蓝由游戏内宠物负责
  enable_hp: true                  # HP 自动喝药开关（F2 切换）
  enable_mp: true                  # MP 自动回蓝开关（F3 切换）
  bar_count: 2                     # 083版本可能只有HP+MP两个条，没有EXP条
  bar_white_thresh: 200            # 降低阈值以匹配灰色/暗色边框
  bar_min_aspect: 2.0              # 放宽宽高比范围
  bar_max_aspect: 15.0
  bar_min_area: 500                # 放宽面积范围
  bar_max_area: 12000
  bar_min_width: 110               # 过滤掉过窄/过宽的白框（防止识别到其他UI）
  bar_max_width: 180
  bar_min_height: 16
  bar_max_height: 24
  add_hp_percent: 50
  add_mp_percent: 10
  hp_rearm_percent: 54          # 回到该值以上才视为本轮回血完成
  mp_rearm_percent: 12          # 回到该值以上才视为本轮回蓝完成
  hp_retry_timeout: 2.0         # 持续低血时，2秒后允许再喝一瓶
  mp_retry_timeout: 1.5         # 持续低蓝时，1.5秒后允许再喝一瓶

ui_coords:
  ui_y_start: 610                   # 根据实际游戏窗口调整：底部UI栏Y起点
